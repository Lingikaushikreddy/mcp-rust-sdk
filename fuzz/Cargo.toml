[package]
name = "mcp-sdk-fuzz"
version = "0.0.0"
publish = false
edition = "2021"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
arbitrary = { version = "1", features = ["derive"] }
mcp-sdk = { path = "../crates/mcp-sdk", features = ["full"] }
tokio = { version = "1", features = ["rt", "time"] }
tower = { version = "0.5", features = ["util"] }
axum = "0.7"
serde_json = "1"
async-trait = "0.1"

# Keep the fuzz crate out of the main workspace.
[workspace]
members = ["."]

[[bin]]
name = "decode_message"
path = "fuzz_targets/decode_message.rs"
test = false
doc = false
bench = false

[[bin]]
name = "stdio_session"
path = "fuzz_targets/stdio_session.rs"
test = false
doc = false
bench = false

[[bin]]
name = "http_post"
path = "fuzz_targets/http_post.rs"
test = false
doc = false
bench = false
