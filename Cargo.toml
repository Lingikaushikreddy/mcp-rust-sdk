[workspace]
resolver = "2"
members = [
    "crates/mcp-sdk",
    "crates/mcp-macros",
    "examples/calculator",
    "examples/filesystem",
    "examples/database",
    "benches",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.87"
license = "MIT OR Apache-2.0"
repository = "https://github.com/Lingikaushikreddy/mcp-rust-sdk"
homepage = "https://github.com/Lingikaushikreddy/mcp-rust-sdk"
keywords = ["mcp", "model-context-protocol", "ai", "llm", "tools"]
categories = ["development-tools", "web-programming"]

[workspace.dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "io-std", "io-util", "net", "sync", "macros", "signal"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
thiserror = "2"
async-trait = "0.1"
axum = { version = "0.7", features = ["macros"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["cors"] }
uuid = { version = "1", features = ["v4"] }
